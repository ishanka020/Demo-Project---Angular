<div class="task-container">
  <h2>My Task List</h2>
  <div class="task-input">
    <input [(ngModel)]="newTask" placeholder="Enter new task" />
    <button (click)="addTask()">Add Task</button>
  </div>

  <div class="filters">
    <label for="filterSelect">Filter</label>
    <select id="filterSelect" [(ngModel)]="filter">
      <option value="all">All</option>
      <option value="active">Active</option>
      <option value="completed">Completed</option>
    </select>
  </div>

  <ul>
    <li *ngFor="let task of filteredTasks; let i = index">
      <span [class.completed]="task.completed">{{ task.text }}</span>
      <input type="checkbox" [checked]="task.completed" (change)="toggleTask(i)" />
      <button (click)="removeTask(i)">Remove</button>
    </li>
  </ul>

  <p *ngIf="tasks.length === 0">No tasks yet. Add one above!</p>
</div>
